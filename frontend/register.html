<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRush — Register</title>
    <meta name="description" content="Create a TypeRush account to join the leaderboard.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body class="inner-page">

    <header class="app-topbar">
        <a href="index.html" class="topbar-brand">
            <span class="topbar-icon">⌨️</span>
            <span class="topbar-name">TypeRush</span>
        </a>
        <nav class="topbar-nav">
            <a href="index.html" class="topbar-nav-link" id="tnHome">Home</a>
            <a href="practice.html" class="topbar-nav-link">Practice</a>
            <a href="weak-keys.html" class="topbar-nav-link">Weak Keys</a>
            <a href="dashboard.html" class="topbar-nav-link">Dashboard</a>
            <a href="login.html" class="topbar-nav-link">Login</a>
            <a href="register.html" class="topbar-nav-link active">Register</a>
        </nav>
    </header>

    <main class="inner-main auth-main">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">🚀</div>
                <h1 class="auth-title">Create an Account</h1>
                <p class="auth-sub">Join TypeRush and boost your typing skills.</p>
            </div>

            <!-- Error/Success message area -->
            <div id="registerMessage" class="auth-message" style="display:none;"></div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" class="auth-input" placeholder="Choose a username" required
                        minlength="3">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" class="auth-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="auth-input"
                        placeholder="Create a password (min 6 chars)" required minlength="6">
                </div>
                <button type="submit" class="ctrl-btn ctrl-btn--primary auth-btn" id="registerBtn">Register</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Log in here</a></p>
            </div>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        // If already logged in, redirect
        if (isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }

        const registerForm = document.getElementById('registerForm');
        const messageDiv = document.getElementById('registerMessage');

        function showMessage(text, isError = true) {
            messageDiv.textContent = text;
            messageDiv.className = 'auth-message ' + (isError ? 'auth-error' : 'auth-success');
            messageDiv.style.display = 'block';
        }

        registerForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('registerBtn');

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                await registerUser(username, email, password);
                showMessage('Account created! Redirecting to login...', false);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
            } catch (err) {
                showMessage(err.message);
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        });
    </script>
</body>

</html>
